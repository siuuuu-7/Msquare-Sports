<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cricket Equipment | MSQUARE SPORTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Existing CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pro.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ===== MARKETPLACE STYLE ===== */
    .category-header {
      padding: 20px;
      background: #f5f7fa;
      border-bottom: 1px solid #ddd;
    }

    .product-list {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .product-row {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 15px;
      padding: 15px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      align-items: center;
    }

    .product-row img {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
    }

    .product-info h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .rating {
      font-size: 14px;
      color: #388e3c;
      margin-bottom: 6px;
    }

    .rating span {
      color: #777;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      background: #ff5722;
      color: #fff;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 3px;
      margin-bottom: 6px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #111;
    }

    .old-price {
      font-size: 13px;
      text-decoration: line-through;
      color: #777;
      margin-left: 6px;
    }

    .action-area button {
      background: #ff9f00;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }

    .action-area button:hover {
      background: #fb8c00;
    }

    @media(max-width: 768px) {
      .product-row {
        grid-template-columns: 100px 1fr;
      }
      .action-area {
        grid-column: span 2;
        text-align: right;
      }
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="main-nav">
  <a href="index.html" class="brand-wrapper logo-text">
    <span class="logo-white">MSQUARE</span>
    <span class="logo-yellow">SPORTS</span>
  </a>
</nav>

<!-- HEADER -->
<section class="category-header">
  <h1>Cricket Equipment</h1>
  <p>Top quality gear trusted by players</p>
</section>

<!-- PRODUCT LIST -->
<section class="product-list">

  <!-- PRODUCT 1 -->
  <div class="product-row">
    <img src="https://i.imgur.com/QOnK57n.png" alt="English Willow Bat">

    <div class="product-info">
      <span class="badge">BESTSELLER</span>
      <h3>English Willow Cricket Bat</h3>
      <div class="rating">
        ★★★★☆ <span>(1,248 ratings)</span>
      </div>
      <div class="price">
        ₹6,999 <span class="old-price">₹8,499</span>
      </div>
    </div>

    <div class="action-area">
      <button onclick="addToBag('bat-1','English Willow Bat',6999,'https://i.imgur.com/QOnK57n.png')">
        ADD TO BAG
      </button>
    </div>
  </div>

  <!-- PRODUCT 2 -->
  <div class="product-row">
    <img src="https://i.imgur.com/QOnK57n.png" alt="Cricket Shoes">

    <div class="product-info">
      <span class="badge">OFFER</span>
      <h3>Professional Cricket Shoes</h3>
      <div class="rating">
        ★★★★★ <span>(862 ratings)</span>
      </div>
      <div class="price">
        ₹3,499 <span class="old-price">₹4,299</span>
      </div>
    </div>

    <div class="action-area">
      <button onclick="addToBag('shoes-1','Cricket Shoes',3499,'https://i.imgur.com/QOnK57n.png')">
        ADD TO BAG
      </button>
    </div>
  </div>

  <!-- PRODUCT 3 -->
  <div class="product-row">
    <img src="https://i.imgur.com/QOnK57n.png" alt="Cricket Helmet">

    <div class="product-info">
      <h3>Protective Cricket Helmet</h3>
      <div class="rating">
        ★★★★☆ <span>(514 ratings)</span>
      </div>
      <div class="price">
        ₹1,899 <span class="old-price">₹2,499</span>
      </div>
    </div>

    <div class="action-area">
      <button onclick="addToBag('helmet-1','Cricket Helmet',1899,'https://i.imgur.com/QOnK57n.png')">
        ADD TO BAG
      </button>
    </div>
  </div>

</section>

<!-- ===== WORKING CART SYSTEM ===== -->
<script>
function addToBag(id, name, price, img) {
  let bag = JSON.parse(localStorage.getItem("bagItems")) || [];

  const existing = bag.find(item => item.id === id);

  if (existing) {
    existing.qty += 1;
  } else {
    bag.push({
      id,
      name,
      price,
      img,
      qty: 1
    });
  }

  localStorage.setItem("bagItems", JSON.stringify(bag));
  alert("Added to bag");
}
</script>

</body>
</html>
