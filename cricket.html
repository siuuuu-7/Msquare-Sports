<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket | Msquare Sports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pro.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- NAVBAR (UNCHANGED) -->
<nav class="main-nav">
  <a href="index.html" class="brand-wrapper logo-text">
    <span class="logo-white">MSQUARE</span>
    <span class="logo-yellow">SPORTS</span>
  </a>
  <div class="nav-actions">
    <span class="nav-icon">
      <i class="fa-solid fa-bag-shopping"></i>
    </span>
  </div>
</nav>

<!-- RESULT HEADER -->
<div class="result-bar">
  <div>
    <div class="crumb">Home › Sports › Cricket</div>
    <div class="count">Showing 1 – 40 of 16,853 results for <b>“cricket”</b></div>
  </div>
  <select>
    <option>Relevance</option>
    <option>Popularity</option>
    <option>Price -- Low to High</option>
    <option>Price -- High to Low</option>
  </select>
</div>

<!-- PRODUCT LIST -->
<section class="fk-list">

<!-- PRODUCT -->
<div class="fk-item">

  <img src="https://i.imgur.com/QOnK57n.png">

  <div class="fk-info">
    <h3>English Willow Cricket Bat</h3>

    <div class="fk-rating" data-id="bat1">
      <span class="rate-box">4.2 ★</span>
      <span class="rate-count">(12,174)</span>
    </div>

    <div class="fk-price">
      ₹6,999 <span class="old">₹8,499</span> <span class="off">18% off</span>
    </div>

    <div class="fk-badges">
      <span class="badge hot">Hot Deal</span>
      <span class="badge few">Only few left</span>
    </div>
  </div>

  <div class="fk-actions">
    <button onclick="addToCart({
      id:'bat1',
      name:'English Willow Cricket Bat',
      price:6999,
      img:'https://i.imgur.com/QOnK57n.png'
    })">ADD TO BAG</button>

    <i class="fa-regular fa-heart"
       onclick="toggleWishlist('bat1', this)"></i>
  </div>

</div>

</section>

<!-- ================= LOGIC ================= -->

<script>
/* USE SAME STORAGE KEY AS cart.js */
const CART_KEY = "cart";

/* ADD TO CART (COMPATIBLE) */
function addToCart(product){
  let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
  const item = cart.find(i => i.id === product.id);

  if(item){
    item.qty += 1;
  } else {
    cart.push({...product, qty:1});
  }

  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  alert("Added to Bag ✔");
}

/* WISHLIST */
function toggleWishlist(id, icon){
  let wl = JSON.parse(localStorage.getItem("wishlist")) || [];
  if(wl.includes(id)){
    wl = wl.filter(x => x !== id);
    icon.className = "fa-regular fa-heart";
  } else {
    wl.push(id);
    icon.className = "fa-solid fa-heart";
  }
  localStorage.setItem("wishlist", JSON.stringify(wl));
}

/* CUSTOMER RATING – ONLY AFTER PURCHASE */
document.querySelectorAll(".fk-rating").forEach(box=>{
  box.onclick = ()=>{
    const id = box.dataset.id;
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    if(!orders.includes(id)){
      alert("Only customers who purchased this item can rate");
      return;
    }
    alert("Rating UI opens here ✔");
  };
});
</script>

</body>
</html>
